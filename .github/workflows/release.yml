on:
  release:
    types: [published]

name: Create Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 1.8
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 8.0.482+8
          distribution: "zulu"
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          server-id: splunk-artifactory
      - name: build
        run: mvn -B package --file pom.xml
      - name: Deploy to Artifactory
        run: mvn --batch-mode deploy
        env:
          MAVEN_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - name: Upload jars to release
        run: gh release upload "$TAG" ./target/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
