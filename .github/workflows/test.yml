name: Java CI with Maven

on: [push]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test (Java ${{ matrix.java-version }}, ${{ matrix.os }})
    strategy:
      matrix:
        java-version:
          - 8
          - 11
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "zulu"
          cache: maven
      - name: Unit Test
        run: mvn -P Unittest -B verify --file pom.xml

  acceptance-test:
    name: Acceptance Test (Splunk ${{ matrix.splunk-version }})
    needs: unit-test
    strategy:
      matrix:
        include:
          - splunk-version: "8.0"
            splunk-image: splunk/splunk:8.0@sha256:d6d64ff30ed713238e0f493f0072aa1bc1e8707bec6d5235f115dcee6dc3a595
          - splunk-version: "8.2"
            splunk-image: splunk/splunk:8.2@sha256:fb09bda7453a579faa4325d49655f89e8fe654fafac159d5d957e845d818abf5
          - splunk-version: "9.1"
            splunk-image: splunk/splunk:9.1@sha256:46ac8d5e1fb6c15fa3abb2cf61d6571dce7d2f720574bd7ab85cb5c2fe0ecab2
    runs-on: ubuntu-latest
    container: maven:3-jdk-8@sha256:ff18d86faefa15d1445d0fa4874408cc96dec068eb3487a0fc6d07f359a24607

    services:
      splunk:
        image: ${{ matrix.splunk-image }}
        env:
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_HEC_TOKEN: 11111111-1111-1111-1111-1111111111113
          SPLUNK_PASSWORD: changed!
        ports:
          - 8089
          - 8088
          - 5555
          - 15000
          - 10667
          - 10668/udp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 8.0.482+8
          distribution: "zulu"
          cache: maven
      - name: Acceptance Test
        run: mvn -P AcceptanceTest -B verify --file pom.xml
        env:
          SPLUNK_PASSWORD: changed!
          SPLUNK_HOST: splunk
