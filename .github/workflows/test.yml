name: Java CI with Maven

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test (Java ${{ matrix.java-version }})
    strategy:
      matrix:
        java-version:
          - 8
          - latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "zulu"
          cache: maven
      - name: Unit Test
        run: mvn -P Unittest -B verify --file pom.xml

  acceptance-test:
    name: Acceptance Test (Splunk ${{ matrix.splunk-version }})
    needs: unit-test
    strategy:
      matrix:
        include:
          - splunk-version: "9.4"
            splunk-image: splunk/splunk:9.4@sha256:8d3849f78c2814fd65e68a69aeaa4d1dc79f37e661dbe48e791f4552b025def5
          - splunk-version: "latest"
            splunk-image: splunk/splunk:latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 8.0.482+8
          distribution: "zulu"
          cache: maven
      - name: Launch Splunk Docker instance
        env:
          SPLUNK_IMAGE: ${{ matrix.splunk-image }}
        run: docker compose up -d
      - name: Wait for Splunk
        run: timeout 600 sh -c 'until docker exec splunk /sbin/checkstate.sh >/dev/null 2>&1; do sleep 5; done'
      - name: Acceptance Test
        run: mvn -P AcceptanceTest -B verify --file pom.xml
