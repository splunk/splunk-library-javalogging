name: Java CI with Maven

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (splunk-${{ matrix.splunk-version }})
    strategy:
      matrix:
        include:
          - splunk-version: "8.2"
            splunk-image: splunk/splunk:8.2@sha256:fb09bda7453a579faa4325d49655f89e8fe654fafac159d5d957e845d818abf5
          - splunk-version: "9.4"
            splunk-image: splunk/splunk:9.4@sha256:8d3849f78c2814fd65e68a69aeaa4d1dc79f37e661dbe48e791f4552b025def5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 8
          distribution: "zulu"
          cache: maven
      - name: Run unit tests
        run: make test_unit
      - name: Launch Splunk Docker instance
        env:
          SPLUNK_IMAGE: ${{ matrix.splunk-image }}
        run: make up
      - name: Wait for Splunk Docker instance
        run: make wait_up
      - name: Run acceptance tests
        run: make test_acceptance
