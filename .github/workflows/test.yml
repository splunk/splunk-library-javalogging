name: Java CI with Maven

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test (Java ${{ matrix.java-version }})
    strategy:
      matrix:
        java-version:
          - 8
          - latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "zulu"
          cache: maven
      - name: Unit Test
        run: mvn -P Unittest -B verify --file pom.xml

  acceptance-test:
    name: Acceptance Test (Splunk ${{ matrix.splunk-version }})
    needs: unit-test
    strategy:
      matrix:
        include:
          - splunk-version: "9.4"
            splunk-image: splunk/splunk:9.4@sha256:8d3849f78c2814fd65e68a69aeaa4d1dc79f37e661dbe48e791f4552b025def5
          - splunk-version: "latest"
            splunk-image: splunk/splunk:latest
    runs-on: ubuntu-latest
    container: maven:3-jdk-8@sha256:ff18d86faefa15d1445d0fa4874408cc96dec068eb3487a0fc6d07f359a24607

    services:
      splunk:
        image: ${{ matrix.splunk-image }} # zizmor: ignore[unpinned-images]
        env:
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_HEC_TOKEN: 11111111-1111-1111-1111-1111111111113
          SPLUNK_PASSWORD: changed!
        ports:
          - 8089
          - 8088
          - 5555
          - 15000
          - 10667
          - 10668/udp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 8.0.482+8
          distribution: "zulu"
          cache: maven
      - name: Acceptance Test
        run: mvn -P AcceptanceTest -B verify --file pom.xml
        env:
          SPLUNK_PASSWORD: changed!
          SPLUNK_HOST: splunk
